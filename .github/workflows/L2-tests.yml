name: L2-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string

env:
  BUILD_TYPE: Debug
  THUNDER_REF: "R4.4.1"
  INTERFACES_REF: "develop"
  RDK_SERVICE_L2_TEST: "ON"

jobs:
  L2-tests:
    name: Build and run L2 tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc ]
        coverage: [ with-coverage ]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
          echo "Message: External Trigger Received for L2 Tests"
          echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.16.x'

      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y
          libsqlite3-dev
          libcurl4-openssl-dev
          valgrind
          lcov
          clang
          libsystemd-dev
          libboost-all-dev
          libwebsocketpp-dev
          meson
          libcunit1
          libcunit1-dev
          curl
          protobuf-compiler-grpc
          libgrpc-dev
          libgrpc++-dev
          libdbus-1-dev

      - name: Install GStreamer
        run: |
          sudo apt update
          sudo apt install -y libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Load uinput kernel module
        run: sudo modprobe uinput

      - name: Build trower-base64
        run: |
          if [ ! -d "trower-base64" ]; then
            git clone https://github.com/xmidt-org/trower-base64.git
          fi
          cd trower-base64
          meson setup --warnlevel 3 --werror build
          ninja -C build
          sudo ninja -C build install

      - name: Checkout Thunder
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{env.THUNDER_REF}}

      - name: Checkout ThunderTools
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: R4.4.3

      - name: Checkout entservices-tools
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v3
        with:
          path: entservices-tools

      - name: Checkout entservices-tools-testframework
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-tools
          path: entservices-tools
          ref: develop

      - name: Checkout entservices-testframework
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: 1.0.14

      - name: Checkout googletest
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Apply patches ThunderTools
        run: |
          cd $GITHUB_WORKSPACE/ThunderTools
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/00010-R4.4-Add-support-for-project-dir.patch
          cd -

      - name: Build ThunderTools
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Apply patches Thunder
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Use_Legact_Alt_Based_On_ThunderTools_R4.4.3.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/error_code_R4_4.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/1004-Add-support-for-project-dir.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-733-Add-ENTOS-IDS.patch
          cd -

      - name: Build Thunder
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=${{env.BUILD_TYPE}}
          -DBINDING=127.0.0.1
          -DPORT=9998
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Checkout entservices-apis
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}

      - name: Build entservices-apis
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Build mocks
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -I $GITHUB_WORKSPACE/install/usr/include"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      - name: Build entservices-tools plugin
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-tools"
          -B build/entservices-tools
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format="
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DPLUGIN_TOOLS=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          &&
          cmake --build build/entservices-tools -j8
          &&
          cmake --install build/entservices-tools

      - name: Build entservices-testframework
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework"
          -B build/entservices-testframework
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICE_L2_TEST
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format="
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DRDK_SERVICE_L2_TEST=${{env.RDK_SERVICE_L2_TEST}}
          -DPLUGIN_L2Tests=OFF
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          &&
          cmake --build build/entservices-testframework -j8
          &&
          cmake --install build/entservices-testframework

      - name: Set up runtime directories
        run: >
          sudo mkdir -p -m 777
          /opt/persistent
          /opt/secure
          /opt/logs
          /tmp/communicator

      - name: Download pact_verifier_cli
        run: |
          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          $GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/pact/install-verifier-cli.sh

      - name: Run L2 tests without valgrind
        if: ${{ !env.ACT }}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/rdkL2TestResults.json"
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      - name: Run L2 tests with valgrind
        if: ${{ !env.ACT }}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/rdkL2TestResults.json"
          valgrind
          --tool=memcheck
          --log-file=valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT }}
        run: >
          lcov -c
          -o coverage.info
          -d build/entservices-tools
          &&
          lcov
          -r coverage.info
          '/usr/include/*'
          '*/build/entservices-tools/_deps/*'
          '*/install/usr/include/*'
          '*/Tests/mocks/*'
          '*/Tests/L2Tests/*'
          '*/googlemock/*'
          '*/googletest/*'
          -o filtered_coverage.info
          &&
          genhtml
          -o coverage
          -t "entservices-tools.plugin L2 coverage"
          filtered_coverage.info

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L2-tools
          path: |
            coverage/
            valgrind_log
            rdkL2TestResultsWithoutValgrind.json
            rdkL2TestResultsWithValgrind.json
          if-no-files-found: warn
